[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/ingest",
    "crates/transcribe",
    "crates/detect",
    "crates/render",
    "crates/llm-judge",
    "crates/frame",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# UI
eframe = "0.34"
egui = "0.34"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Workspace crates
yc-core = { path = "crates/core" }
yc-ingest = { path = "crates/ingest" }
yc-transcribe = { path = "crates/transcribe" }
yc-detect = { path = "crates/detect" }
yc-render = { path = "crates/render" }
yc-frame = { path = "crates/frame" }

[profile.release]
lto = "thin"
