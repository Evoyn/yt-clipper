[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/ingest",
    "crates/transcribe",
    "crates/detect",
    "crates/render",
    "crates/whisper",
    "crates/llm-judge",
    "crates/frame",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# UI — `persistence` keeps egui memory (panel sizes incl. the operator's
# timeline height, window geometry) across launches, in the OS app-data dir.
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ONNX Runtime — detect (ser/sep), frame (face/voice), and transcribe (align)
# all link the SAME runtime DLL, so the version is pinned once here: an
# independent bump in one crate would skew the ABI the others load.
ort = "2.0.0-rc.12"
# WAV read/write (ingest extraction + detect fixtures).
hound = "3"
# rustls HTTP: native DASH section fetch (ADR 0060) + in-app downloads (ADR 0041).
ureq = "3"
# Workspace crates
yc-core = { path = "crates/core" }
yc-ingest = { path = "crates/ingest" }
yc-transcribe = { path = "crates/transcribe" }
yc-detect = { path = "crates/detect" }
yc-render = { path = "crates/render" }
yc-frame = { path = "crates/frame" }

[profile.release]
lto = "thin"
# Line tables only (ADR 0072 Slice 0): the release panic hook's crash.log
# backtrace resolves to function names + lines (dbghelp reads the .pdb beside
# the exe) instead of bare addresses. Not full debug info — binaries stay lean.
debug = 1
