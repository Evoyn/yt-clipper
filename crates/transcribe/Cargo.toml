[package]
name = "yc-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yc-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The curatable dialect/slang correction store (per-language JSON).
serde.workspace = true
serde_json.workspace = true
# Forced-alignment timing skeleton (ADR 0053/0054): the wav2vec2-CTC ONNX
# session behind the `align` feature. Same runtime the face/voice/ser models
# share; the Viterbi + tokenization in `align` are pure and always compiled.
ort = { version = "2.0.0-rc.12", optional = true }
# `tracing_backend` routes whisper.cpp/ggml's own logging through `tracing`, so
# its verbose per-token DEBUG dump is dropped by the app's `info` filter instead
# of flooding stderr (install via `install_logging_hooks`).
whisper-rs = { version = "0.16.0", features = ["cuda", "tracing_backend"] }

[features]
# wav2vec2-CTC forced alignment (ADR 0053/0054): pulls the `ort` ONNX runtime.
# Off by default so the crate's tests need neither the ort binary nor the model;
# the pure Viterbi/tokenization in `align` compile and test regardless.
align = ["dep:ort"]
