[package]
name = "yc-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yc-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
# `tracing_backend` routes whisper.cpp/ggml's own logging through `tracing`, so
# its verbose per-token DEBUG dump is dropped by the app's `info` filter instead
# of flooding stderr (install via `install_logging_hooks`).
whisper-rs = { version = "0.16.0", features = ["cuda", "tracing_backend"] }
