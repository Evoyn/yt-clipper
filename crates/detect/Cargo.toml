[package]
name = "yc-detect"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yc-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hound = "3"
ort = { version = "2.0.0-rc.12", optional = true }

[features]
# Speech-emotion (arousal) inference via ONNX Runtime (ADR 0008). Off by
# default so the fast detection tests need neither the `ort` binary nor the SER
# model; the app and the `detect_vod` harness enable it. The first build with
# `--features ser` triggers a one-time ONNX Runtime binary download.
ser = ["dep:ort"]
# Vocal separation (htdemucs vocals ONNX) via ONNX Runtime — the per-Segment
# Vocal stem spike. Same `ort` runtime as `ser`; off by default.
sep = ["dep:ort"]

[dev-dependencies]
# The detect_vod harness reads candidate audio ranges to score arousal (ADR
# 0008 gate); reuse the ingest sample reader rather than re-implement it.
yc-ingest.workspace = true
