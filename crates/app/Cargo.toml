[package]
name = "yt-clipper"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yt-clipper"
path = "src/main.rs"

[dependencies]
yc-core.workspace = true
yc-ingest.workspace = true
yc-transcribe.workspace = true
yc-detect.workspace = true
yc-render.workspace = true
yc-frame.workspace = true
eframe.workspace = true
egui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# JSON IPC with the yc-llm-judge sidecar (ADR 0010).
serde_json.workspace = true
# Audio playback for the Moment review UI (ADR 0001: review by ear, no scrubbing).
rodio = "0.19"
# Native file-open dialog for importing a local VOD.
rfd = "0.15"
# In-app dependency downloads (ADR 0041): pinned official URLs, streamed with
# progress, SHA-256-verified, unzipped where the pin is an archive. rustls so
# no OS TLS stack is assumed; deflate is the only compression release zips use.
ureq = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Embeds assets/branding/yt-clipper.ico as the exe icon (brand pass); the
# window/taskbar IconData is a raw-RGBA include, so no image decoder ships.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Speech-emotion (arousal) detection signal (ADR 0008): pulls `ort` via
# yc-detect and reads the SER model. Off by default so the app builds without
# the ONNX Runtime binary; detection then simply omits arousal.
ser = ["yc-detect/ser"]
# Auto-detect framing (M6, ADR 0011): pulls `ort` via yc-frame for Ultraface
# face detection. Off by default so the app builds without the ONNX Runtime
# binary; framing then falls back to full-frame gameplay. The pure layout
# geometry (yc-frame) is always linked regardless of this feature. Also pulls
# the voice speaker-embedding session (same ort runtime) so the speaker_diag
# harness can measure the diarization spike (ADR 0042 gate pending) — no
# production job calls it yet.
face = ["yc-frame/face", "yc-frame/voice"]
# Vocal-stem captions: pulls `ort` via yc-detect and the htdemucs model, so the
# export transcribes the streamer's voice split from music/SFX instead of the
# mixed analysis audio. Off by default; the export then captions the mix as
# before. Only the caption source changes — the rendered clip's audio is the mix.
sep = ["yc-detect/sep"]
# Cleaned-voice captions (ADR 0029): runs the bundled `deep-filter` DeepFilterNet
# sidecar (gentle -a12 denoise) over the caption audio before whisper, so the
# streamer's voice reads above game SFX. Pulls NO new deps — the denoiser is an
# external sidecar like ffmpeg/yt-dlp. Off by default; the export then captions the
# mix. Takes precedence over `sep`; the rendered clip's audible audio is the mix.
enh = []
# LLM caption-correction pass (ADR 0030): after whisper + the dialect dict, send the
# caption units + per-word confidence + the store's context overrides to the
# out-of-process `yc-llm-judge --correct` and map the reply back onto unit timing,
# repairing linguistic errors (garble / slang / names) the audio path can't. Pulls
# NO new deps (the sidecar already exists for the detect judge). Off by default; the
# default build captions exactly as before. Operator A/Bs the real render first.
correct = []
# Forced-alignment caption timing (ADR 0053/0054): pulls `ort` via yc-transcribe
# for the wav2vec2-CTC aligner (models/w2v2-align-id). Since the ADR 0055 flip
# this IS the ensemble's default timing skeleton on builds with this feature
# (YC_FORCED_ALIGN=0 is the off-switch back to the whisper DTW fusion). Builds
# WITHOUT the feature keep the DTW fusion — whisper-engine renders are untouched
# either way.
align = ["yc-transcribe/align"]

# The forced-alignment parity/gate harnesses need the ort session compiled in.
[[example]]
name = "align_parity"
required-features = ["align"]

[[example]]
name = "caption_align_diag"
required-features = ["align"]
